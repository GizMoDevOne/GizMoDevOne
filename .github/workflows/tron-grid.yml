name: Update Tron Grid

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out profile repository
        uses: actions/checkout@v5

      - name: Generate contribution energy grid
        uses: GizMoDevOne/github-tron-grid@v2
        with:
          github_user: ${{ github.repository_owner }}
          github_token: ${{ secrets.TRON_TOKEN }}
          theme: tron
          animation: hilbert
          speed: "1.5"
          particles: "5"
          trail_length: "30"
          electric: "true"
          output: assets/tron-grid.svg

      - name: Commit updated SVG
        shell: bash
        run: |
          git add assets/tron-grid.svg
          if git diff --cached --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: update Tron contribution grid"
          git push
